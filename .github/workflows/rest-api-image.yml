name: REST API development image
on:
  push:
    branches: [feature/rest-api]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: rest-api-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/dotcomva/heyform:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test authenticated API
        shell: bash
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          docker network create heyform-test
          docker run -d --name mongo --network heyform-test mongo:7
          docker run -d --name redis --network heyform-test redis:7-alpine
          docker run -d --name heyform --network heyform-test -p 127.0.0.1:9157:9157 \
            -e MONGO_URI=mongodb://mongo:27017/heyform \
            -e REDIS_HOST=redis \
            -e APP_HOMEPAGE_URL=http://localhost:9157 \
            -e SESSION_KEY="$(openssl rand -hex 32)" \
            -e FORM_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e HEYFORM_REST_API_KEY="$key" \
            ghcr.io/dotcomva/heyform:dev
          for i in $(seq 1 60); do
            if curl -fsS -H "Authorization: Bearer $key" http://127.0.0.1:9157/api/v1/health > /tmp/health.json; then break; fi
            sleep 3
          done
          jq -e '.status == "ok" and .version == "v1"' /tmp/health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9157/api/v1/health)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer invalid' http://127.0.0.1:9157/api/v1/health)" = 401
      - name: Container logs on failure
        if: failure()
        run: docker logs heyform || true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: |
          docker tag ghcr.io/dotcomva/heyform:dev ghcr.io/dotcomva/heyform:sha-${GITHUB_SHA}
          docker push ghcr.io/dotcomva/heyform:sha-${GITHUB_SHA}
          docker push ghcr.io/dotcomva/heyform:dev
